name: Check code
on:
  push:
    paths:
      - "*.py"
      - ".github/workflows/*.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Синтаксис всех скриптов
        run: python -m py_compile *.py
      - name: lint очередей без обращения к сети
        run: |
          python publish.py --lint
          python social.py --lint
          python social_publish.py --plan 7
