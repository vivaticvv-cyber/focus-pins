name: Generate pins
on:
  schedule:
    - cron: "0 7 * * *"   # каждый день 07:00 UTC (~10:00 Киев)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python generate.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PINS_PER_RUN: "3"
      - name: Commit results
        run: |
          git config user.name "focus-bot"
          git config user.email "focus-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "pins: generated" && git push)
