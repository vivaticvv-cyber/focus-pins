name: Restore publish files
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore publish.py and social_publish.py
        run: |
          set -e
          git show 1e08de15fed08fd0c4ccd563b9c2783ab99b895d:publish.py > publish.py
          sed -i 's/STOCK_DAYS=3,/STOCK_DAYS=5,/' publish.py
          git show 1e08de15fed08fd0c4ccd563b9c2783ab99b895d:social_publish.py > social_publish.py
          sed -i 's/PATTERN={"facebook": (3, (0,)), "x": (3, (1, 2))}/PATTERN={"facebook": (1, (0,)), "x": (1, (0,))}/' social_publish.py
          # daily.yml: default stock 5
          sed -i 's/description: "Склад на N дней вперёд (пусто = 3). Для первого запуска можно 5"/description: "Склад на N дней вперёд (пусто = 5)"/' .github/workflows/daily.yml || true
          python3 -c "import publish; assert publish.cfg('STOCK_DAYS')==5; print('STOCK_DAYS', publish.cfg('STOCK_DAYS'))"
          python3 -c "import social_publish as s; print('PATTERN', s.CONFIG['PATTERN'])"
          git config user.name focus-bot
          git config user.email focus-bot@users.noreply.github.com
          git add publish.py social_publish.py .github/workflows/daily.yml
          git diff --cached --quiet && echo 'nothing to commit' && exit 0
          git commit -m 'restore publish.py STOCK_DAYS=5; Buffer every free day for FB/X'
          git push
