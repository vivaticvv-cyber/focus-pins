name: Restore publish files
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore publish.py and social_publish.py
        run: |
          set -e
          git show 1e08de15fed08fd0c4ccd563b9c2783ab99b895d:publish.py > publish.py
          sed -i 's/STOCK_DAYS=3,/STOCK_DAYS=5,/' publish.py
          git show 1e08de15fed08fd0c4ccd563b9c2783ab99b895d:social_publish.py > social_publish.py
          sed -i 's/PATTERN={"facebook": (3, (0,)), "x": (3, (1, 2))}/PATTERN={"facebook": (1, (0,)), "x": (1, (0,))}/' social_publish.py
          grep -n 'STOCK_DAYS' publish.py | head -2
          grep -n 'PATTERN' social_publish.py | head -2
          python3 -c "import ast; ast.parse(open('publish.py').read()); ast.parse(open('social_publish.py').read()); print('syntax OK')"
          git config user.name focus-bot
          git config user.email focus-bot@users.noreply.github.com
          git add publish.py social_publish.py
          git commit -m 'restore publish.py STOCK_DAYS=5; Buffer FB/X every free day' || echo 'nothing to commit'
          git push
