name: Merge pins batch

# Добавляет новые строки из pins_batch_N.csv в pins.csv, не меняя статусы уже сделанных пинов.
# Запуск вручную: Actions -> «Merge pins batch» -> Run workflow.
on:
  workflow_dispatch:

concurrency:
  group: pins
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python merge_batch.py
      - name: Commit
        if: ${{ success() }}
        run: |
          git config user.name "focus-bot"
          git config user.email "focus-bot@users.noreply.github.com"
          git add pins.csv batches
          git add -A pins_batch_*.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "pins: merge batch"
          git pull --rebase --autostash || true
          git push || (git pull --rebase --autostash && git push)
