name: Test image generation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "demo = по картинке на каждый стиль (10 шт. + общий лист contact_sheet.jpg), test = первые 3 пина из pins.csv"
        type: choice
        options: [demo, test]
        default: demo
      guidance:
        description: "Cloudflare guidance (пусто = по умолчанию; для сравнения можно 0 или 1)"
        required: false
        default: ""

concurrency:
  group: pins
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python generate.py --${{ inputs.mode }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_GUIDANCE: ${{ inputs.guidance }}
          HF_MAX_PER_RUN: "0"   # в тесте проверяем только Cloudflare
      - name: Commit test images
        if: ${{ !cancelled() }}
        run: |
          git config user.name "focus-bot"
          git config user.email "focus-bot@users.noreply.github.com"
          git add test
          git diff --cached --quiet || git commit -m "test: images"
          git pull --rebase --autostash || true
          git push || (git pull --rebase --autostash && git push)
