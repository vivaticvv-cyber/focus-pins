name: Fix merge_batch syntax
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Fix two missing closing parens
        run: |
          python3 <<'PY'
          from pathlib import Path
          import ast
          p = Path("merge_batch.py")
          c = p.read_text()
          c2 = c.replace(
              'rejected.append((r, "строка без числового id")\n',
              'rejected.append((r, "строка без числового id"))\n',
          )
          c2 = c2.replace(
              'added_total.append((fn, len(fresh))\n',
              'added_total.append((fn, len(fresh)))\n',
          )
          ast.parse(c2)
          assert "shape_issue" in c2
          p.write_text(c2)
          print("fixed ok", len(c2))
          PY
      - name: Commit and remove this workflow
        run: |
          git config user.name focus-bot
          git config user.email focus-bot@users.noreply.github.com
          git add merge_batch.py
          git commit -m "fix merge_batch.py: restore two missing parens (syntax)"
          rm -f .github/workflows/fix-merge-batch.yml
          git add -u .github/workflows/fix-merge-batch.yml
          git commit -m "remove one-shot fix-merge-batch workflow" || true
          git pull --rebase -q || true
          git push
