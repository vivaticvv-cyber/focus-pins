name: Autopilot

# Каждый день без участия человека:
# 1) (по желанию, RECYCLE=1) запасной вариант: свежие версии прежних материалов (recycle.py),
# 2) рисует картинки для постов Facebook и X (social.py --stock),
# 3) планирует в Buffer посты Facebook и X на сегодня (social_publish.py).
# Пины Pinterest ведёт «Daily pins» (daily.yml), он не меняется.
on:
  schedule:
    - cron: "40 21 * * *"
    - cron: "55 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = как по расписанию; dry-run = показать план Facebook/X без отправки; check = связь с Buffer; plan = план по дням"
        type: choice
        options: [run, dry-run, check, plan]
        default: run

concurrency:
  group: pins
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  MODE: ${{ inputs.mode || 'run' }}

jobs:
  autopilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Выключено по умолчанию: тексты не повторяются 1 в 1. Включить (только как запасной вариант) — переменная репозитория RECYCLE=1.
      - name: Пополнить очередь свежими версиями (запасной вариант)
        if: ${{ env.MODE == 'run' && vars.RECYCLE == '1' }}
        env:
          FB_START: ${{ vars.FB_START }}
          X_START: ${{ vars.X_START }}
        run: python recycle.py

      - name: Картинки для Facebook и X
        if: ${{ env.MODE == 'run' }}
        continue-on-error: true
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          HF_MAX_PER_RUN: "0"
        run: python social.py --stock 6

      - name: Сохранить картинки и очереди
        if: ${{ !cancelled() && env.MODE == 'run' }}
        run: |
          git config user.name "focus-bot"
          git config user.email "focus-bot@users.noreply.github.com"
          git add pins.csv social.csv images
          git diff --cached --quiet || git commit -m "autopilot: queue and images"
          git pull --rebase --autostash || true
          git push || (git pull --rebase --autostash && git push) || true

      - name: Публикация Facebook и X в Buffer
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          FB_START: ${{ vars.FB_START }}
          X_START: ${{ vars.X_START }}
        run: |
          case "$MODE" in
            run)     python social_publish.py ;;
            dry-run) python social_publish.py --dry-run ;;
            check)   python social_publish.py --check ;;
            plan)    python social_publish.py --plan ;;
          esac

      - name: Сохранить статусы social.csv
        if: ${{ !cancelled() && env.MODE == 'run' }}
        run: |
          git config user.name "focus-bot"
          git config user.email "focus-bot@users.noreply.github.com"
          git add social.csv
          git diff --cached --quiet || git commit -m "social: publish statuses"
          git pull --rebase --autostash || true
          git push || (git pull --rebase --autostash && git push) || true
